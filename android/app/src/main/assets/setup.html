<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sharkord</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ccccdd;
      padding: 24px;
      gap: 20px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
    }

    p {
      font-size: 15px;
      color: #8888aa;
      max-width: 340px;
      text-align: center;
      line-height: 1.5;
    }

    input {
      width: 100%;
      max-width: 340px;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid #333355;
      background: #16162b;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
    }

    input:focus {
      border-color: #5865f2;
    }

    button {
      width: 100%;
      max-width: 340px;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #5865f2;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
    }

    button:active {
      background: #4752c4;
    }

    #error-msg {
      color: #f04747;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h1>Sharkord</h1>
  <p>Enter the URL of your Sharkord instance to get started.</p>
  <input type="url" id="url-input" placeholder="http://192.168.1.100:3000" autocomplete="off" spellcheck="false"/>
  <span id="error-msg"></span>
  <button id="connect-btn">Connect</button>

  <script>
    const input = document.getElementById('url-input');
    const btn = document.getElementById('connect-btn');
    const errMsg = document.getElementById('error-msg');

    // Pre-fill saved URL if any
    const saved = window.SharkordBridge.getSavedUrl();
    if (saved) input.value = saved;

    btn.addEventListener('click', handleConnect);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleConnect();
    });

    function handleConnect() {
      const url = input.value.trim();
      if (!url) {
        errMsg.textContent = 'Please enter a URL.';
        return;
      }
      try { new URL(url); } catch {
        errMsg.textContent = 'Please enter a valid URL.';
        return;
      }
      errMsg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connecting...';
      window.SharkordBridge.connect(url);
    }
  </script>

</body>
</html>
