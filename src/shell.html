<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharkord</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Drag region at the top for the native overlay area */
    #drag-region {
      height: 32px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      background: #0f0f23;
      display: flex;
      align-items: center;
      padding-left: 12px;
    }

    #drag-region .title {
      color: #8888aa;
      font-size: 12px;
      font-weight: 500;
    }

    /* ── Setup screen ─────────────────────────────────────────── */
    #setup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: #ccccdd;
      gap: 20px;
    }

    #setup h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
    }

    #setup p {
      font-size: 14px;
      color: #8888aa;
      max-width: 400px;
      text-align: center;
      line-height: 1.5;
    }

    #setup input {
      width: 360px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #333355;
      background: #16162b;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    #setup input:focus {
      border-color: #5865f2;
    }

    #setup button {
      padding: 10px 32px;
      border-radius: 6px;
      border: none;
      background: #5865f2;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #setup button:hover {
      background: #4752c4;
    }

    #error-msg {
      color: #f04747;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div id="drag-region">
    <span class="title">Sharkord</span>
  </div>

  <div id="setup">
    <h1>Sharkord</h1>
    <p>Enter the URL of your Sharkord instance to get started.</p>
    <input type="url" id="url-input" placeholder="http://localhost:3000" autocomplete="off" spellcheck="false"/>
    <span id="error-msg"></span>
    <button id="connect-btn">Connect</button>
  </div>

  <script>
    const { getConfig, connectUrl } = window.sharkord;

    const input = document.getElementById('url-input');
    const btn = document.getElementById('connect-btn');
    const errMsg = document.getElementById('error-msg');

    (async () => {
      const config = await getConfig();
      input.value = config.url || 'http://localhost:3000';
    })();

    btn.addEventListener('click', () => handleConnect());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleConnect();
    });

    async function handleConnect() {
      const url = input.value.trim();
      if (!url) {
        errMsg.textContent = 'Please enter a URL.';
        return;
      }
      try { new URL(url); } catch {
        errMsg.textContent = 'Please enter a valid URL.';
        return;
      }
      errMsg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connecting...';
      await connectUrl(url);
    }
  </script>

</body>
</html>
