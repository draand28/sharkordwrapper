<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share your screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    .header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .cancel-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid #333355;
      color: #8888aa;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .cancel-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #ffffff;
    }

    .tabs {
      display: flex;
      gap: 0;
      padding: 0 20px;
      border-bottom: 1px solid #333355;
      flex-shrink: 0;
    }

    .tab {
      padding: 8px 16px;
      font-size: 13px;
      color: #8888aa;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .tab:hover { color: #ccccdd; }
    .tab.active {
      color: #5865f2;
      border-bottom-color: #5865f2;
    }

    .grid {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .source {
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid transparent;
      padding: 8px;
      transition: border-color 0.15s, background 0.15s;
      background: #16162b;
    }

    .source:hover {
      border-color: #5865f2;
      background: #1e1e3a;
    }

    .source img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: contain;
      border-radius: 4px;
      background: #0a0a1a;
    }

    .source .name {
      margin-top: 6px;
      font-size: 12px;
      color: #ccccdd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .grid::-webkit-scrollbar { width: 6px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: #333355; border-radius: 3px; }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #333355;
      flex-shrink: 0;
    }

    .audio-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #ccccdd;
      user-select: none;
    }

    .audio-toggle input[type="checkbox"] {
      accent-color: #5865f2;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Share your screen</h2>
    <button class="cancel-btn" id="cancel">Cancel</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-type="screen">Screens</button>
    <button class="tab" data-type="window">Windows</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <label class="audio-toggle">
      <input type="checkbox" id="share-audio">
      Share system audio
    </label>
  </div>

  <script>
    const grid = document.getElementById('grid');
    let allSources = [];
    let currentTab = 'screen';

    document.getElementById('cancel').addEventListener('click', () => {
      window.picker.cancel();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelector('.tab.active').classList.remove('active');
        tab.classList.add('active');
        currentTab = tab.dataset.type;
        renderSources();
      });
    });

    window.picker.onSources((sources) => {
      allSources = sources;
      renderSources();
    });

    function renderSources() {
      grid.innerHTML = '';
      const filtered = allSources.filter(s =>
        currentTab === 'screen' ? s.id.startsWith('screen:') : s.id.startsWith('window:')
      );

      filtered.forEach(source => {
        const div = document.createElement('div');
        div.className = 'source';
        div.innerHTML = `
          <img src="${source.thumbnail}" alt="${source.name}"/>
          <div class="name" title="${source.name}">${source.name}</div>
        `;
        div.addEventListener('click', () => {
          window.picker.select(source.id, document.getElementById('share-audio').checked);
        });
        grid.appendChild(div);
      });
    }
  </script>

</body>
</html>
